<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Painel do professor</title>
<style>
body{font:15px/1.4 system-ui,Segoe UI,Arial,sans-serif;margin:0;background:#f4f6fa;color:#1f2430}
header{background:#1C5FD4;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header h1{font-size:18px;margin:0;flex:1}
main{padding:12px 16px;max-width:1300px;margin:0 auto}
.card{background:#fff;border:1px solid #d7deea;border-radius:10px;padding:12px;margin:10px 0}
input,select,button{font:inherit;padding:7px 10px;border:1px solid #9aa7bd;border-radius:8px;background:#fff}button{background:#1C5FD4;color:#fff;border-color:#1C5FD4;cursor:pointer}button.sec{background:#fff;color:#1C5FD4}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #e3e8f1;padding:6px 8px;text-align:left;white-space:nowrap}th{background:#eef2fa;position:sticky;top:0;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tabs button{background:#fff;color:#1C5FD4}.tabs button.on{background:#1C5FD4;color:#fff}
.pill{display:inline-block;border-radius:12px;padding:1px 9px;font-size:12px;font-weight:600}.r{background:#ffd9d4;color:#a31}.y{background:#fff0bf;color:#7a5a00}.g{background:#d6f3dd;color:#17692b}.n{background:#e6eaf2;color:#556}
.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{background:#fff;border:1px solid #d7deea;border-radius:10px;padding:8px 14px;min-width:130px}.kpi b{font-size:22px;display:block}
.sc{overflow:auto;max-height:68vh}#login{max-width:360px;margin:12vh auto}
</style></head><body>
<div id="login" class="card"><h2 style="margin-top:0">Painel do professor</h2><p>Trilha avaliativa · 2º ano EM</p><input type="password" id="pw" placeholder="Senha" style="width:100%;box-sizing:border-box"><p id="er" style="color:#a31"></p><button id="go" style="width:100%">Entrar</button></div>
<div id="painel" style="display:none"><header><h1>Painel · Trilha avaliativa 2º ano EM</h1><select id="ft"><option value="">Todas as turmas</option></select><input id="bq" placeholder="Buscar aluno"><button class="sec" id="rf">Atualizar</button><button class="sec" id="csv">Baixar CSV</button><span id="up" style="font-size:12px"></span></header>
<main><div class="kpis" id="kp"></div><div class="tabs" id="tb"></div><div class="card sc" id="cx"></div></main></div>
<script>
var SCRIPT_URL='@@URL@@',D=null,tab='lib',sortK=null,sortD=1,tmr=null;
function api(p,ok,fail){var cb='cb'+Date.now()+Math.floor(Math.random()*1e6),s=document.createElement('script'),done=0;function clean(){done=1;try{delete window[cb]}catch(e){window[cb]=undefined}if(s.parentNode)s.parentNode.removeChild(s)}
 window[cb]=function(r){if(!done){clean();ok(r)}};var q='?cb='+cb;for(var k in p)q+='&'+k+'='+encodeURIComponent(p[k]);s.src=SCRIPT_URL+q;s.onerror=function(){if(!done){clean();fail()}};setTimeout(function(){if(!done){clean();fail()}},25000);document.head.appendChild(s)}
function $(i){return document.getElementById(i)}function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pw(){try{return sessionStorage.getItem('pw')||''}catch(e){return ''}}
function entrar(){var s=$('pw').value;if(!s)return;$('er').textContent='Conectando…';api({a:'painel',s:s},function(r){if(r&&r.ok){try{sessionStorage.setItem('pw',s)}catch(e){}D=r;$('login').style.display='none';$('painel').style.display='block';desenha();clearInterval(tmr);tmr=setInterval(atualiza,20000)}else $('er').textContent=r&&r.erro==='senha'?'Senha incorreta.':'Erro: '+(r&&r.erro)},function(){$('er').textContent='Sem conexão com o servidor.'})}
function atualiza(){var s=pw();if(!s)return;api({a:'painel',s:s},function(r){if(r&&r.ok){D=r;desenha()}},function(){$('up').textContent='falha ao atualizar'})}
$('go').onclick=entrar;$('pw').onkeydown=function(e){if(e.key==='Enter')entrar()};$('rf').onclick=atualiza;
function num(x){x=parseFloat(String(x).replace(',','.'));return isNaN(x)?0:x}
function filtro(l,ix){var t=$('ft').value,q=$('bq').value.trim().toLowerCase();return l.filter(function(r){return(!t||String(r[ix.t]).toLowerCase()===t.toLowerCase())&&(!q||String(r[ix.n]).toLowerCase().indexOf(q)>=0)})}
function pill(v,l1,l2,txt){return '<span class="pill '+(v>=l2?'r':v>=l1?'y':'g')+'">'+(txt==null?v:txt)+'</span>'}
function desenha(){var turmas={};D.resumo.forEach(function(r){turmas[r[1]]=1});var cur=$('ft').value,h='<option value="">Todas as turmas</option>';Object.keys(turmas).sort().forEach(function(t){h+='<option'+(t===cur?' selected':'')+'>'+esc(t)+'</option>'});$('ft').innerHTML=h;$('ft').onchange=$('bq').oninput=desenha;
 var res=filtro(D.resumo,{n:0,t:1}),ev=filtro(D.eventos,{n:1,t:2}),au=filtro(D.aulas,{n:1,t:2});
 var med=res.length?res.reduce(function(a,r){return a+num(r[8])},0)/res.length:0,trocas=ev.filter(function(e){return e[4]==='troca_tela'}).length,trav=ev.filter(function(e){return e[4]==='trava_antichute'}).length;
 $('kp').innerHTML=[['Alunos',res.length],['Média parcial (0–10)',med.toFixed(2).replace('.',',')],['Trocas de tela',trocas],['Travas anti-chute',trav],['Duplas formadas',D.duplas.filter(function(d){return d[3]}).length]].map(function(k){return '<div class="kpi"><b>'+k[1]+'</b>'+k[0]+'</div>'}).join('');
 var T=[['lib','Liberação'],['res','Notas'],['alt','Alertas'],['aul','Por aula'],['dup','Duplas'],['evt','Eventos']];$('tb').innerHTML=T.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');document.querySelectorAll('#tb button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;desenha()}});
 var h2='';
 if(tab==='lib'){var tt={1:'A cena do crime: o orçamento rasgado (plugada)',2:'O empréstimo do Seu Zé (desplugada, dupla)',3:'A planta do estande (plugada)',4:'O sorteio da rifa (desplugada, dupla)',5:'O relatório final e o veredito (plugada)'};h2='<p>Os alunos só conseguem abrir a aula depois que você libera. Fechar uma aula impede novas entradas; quem já terminou continua vendo o resultado.</p><table><tr><th>Aula</th><th>Título</th><th>Estado</th><th></th></tr>'+[1,2,3,4,5].map(function(n){var on=D.lib&&D.lib[n];return '<tr><td><b>'+n+'</b></td><td>'+tt[n]+'</td><td><span class="pill '+(on?'g':'n')+'">'+(on?'LIBERADA':'FECHADA')+'</span></td><td><button data-lb="'+n+'" data-v="'+(on?0:1)+'" class="'+(on?'sec':'')+'">'+(on?'Fechar aula':'Liberar aula')+'</button></td></tr>'}).join('')+'</table>'}
 if(tab==='res'){var rows=res.slice();if(sortK!=null)rows.sort(function(a,b){var x=a[sortK],y=b[sortK];return(isNaN(parseFloat(x))||isNaN(parseFloat(y))?String(x).localeCompare(String(y)):num(x)-num(y))*sortD});
  var cols=['Nome','Turma','Dupla','Aula 1','Aula 2','Aula 3','Aula 4','Aula 5','Nota (0-10)','Trocas de tela','Travas','Parado (min)','Atualizado'];
  h2='<table><tr>'+cols.map(function(c,i){return '<th data-s="'+i+'">'+c+'</th>'}).join('')+'</tr>'+rows.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td>'+[3,4,5,6,7].map(function(i){return '<td>'+(r[i]===''?'<span class="pill n">–</span>':String(r[i]).replace('.',','))+'</td>'}).join('')+'<td><b>'+String(r[8]).replace('.',',')+'</b></td><td>'+pill(num(r[9]),2,4)+'</td><td>'+pill(num(r[10]),1,3)+'</td><td>'+String(r[11]).replace('.',',')+'</td><td>'+esc(r[12])+'</td></tr>'}).join('')+'</table>'}
 if(tab==='alt'){var al=ev.filter(function(e){return['troca_tela','trava_antichute','tempo_parado'].indexOf(e[4])>=0}).slice().reverse();
  h2=al.length?'<table><tr><th>Quando</th><th>Aluno</th><th>Turma</th><th>Aula</th><th>Alerta</th><th>Detalhe</th></tr>'+al.map(function(e){var c=e[4]==='troca_tela'?'r':e[4]==='trava_antichute'?'y':'n',nm={troca_tela:'Troca de tela',trava_antichute:'Anti-chute',tempo_parado:'Tempo parado'}[e[4]];return '<tr><td>'+esc(e[0])+'</td><td>'+esc(e[1])+'</td><td>'+esc(e[2])+'</td><td>'+esc(e[3])+'</td><td><span class="pill '+c+'">'+nm+'</span></td><td>'+esc(e[5])+'</td></tr>'}).join('')+'</table>':'<p>Nenhum alerta até agora.</p>'}
 if(tab==='aul'){h2='<table><tr><th>Envio</th><th>Aluno</th><th>Turma</th><th>Dupla</th><th>Aula</th><th>Acertos</th><th>Pontos</th><th>Ativo (min)</th><th>Parado (min)</th><th>Trocas</th><th>Travas</th><th>Respostas</th><th>Enviado por</th></tr>'+au.slice().reverse().map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td>'+esc(r[4])+'</td><td>'+esc(r[5])+'/'+esc(r[6])+'</td><td><b>'+String(r[7]).replace('.',',')+'</b></td><td>'+esc(r[8])+'</td><td>'+esc(r[9])+'</td><td>'+pill(num(r[10]),1,3)+'</td><td>'+pill(num(r[11]),1,3)+'</td><td style="font-family:monospace">'+esc(String(r[12]).replace("'",''))+'</td><td>'+esc(r[13])+'</td></tr>'}).join('')+'</table>'}
 if(tab==='dup'){h2='<table><tr><th>Código</th><th>Aluno A</th><th>Turma</th><th>Aluno B</th><th>Criada</th><th>Formada</th></tr>'+D.duplas.map(function(d){return '<tr><td><b>'+esc(d[0])+'</b></td><td>'+esc(d[1])+'</td><td>'+esc(d[2])+'</td><td>'+(d[3]?esc(d[3]):'<span class="pill y">sem par</span>')+'</td><td>'+esc(d[4])+'</td><td>'+esc(d[5])+'</td></tr>'}).join('')+'</table>'}
 if(tab==='evt'){h2='<table><tr><th>Quando</th><th>Aluno</th><th>Turma</th><th>Aula</th><th>Tipo</th><th>Detalhe</th></tr>'+ev.slice().reverse().map(function(e){return '<tr><td>'+esc(e[0])+'</td><td>'+esc(e[1])+'</td><td>'+esc(e[2])+'</td><td>'+esc(e[3])+'</td><td>'+esc(e[4])+'</td><td style="white-space:normal">'+esc(e[5])+'</td></tr>'}).join('')+'</table>'}
 $('cx').innerHTML=h2;document.querySelectorAll('button[data-lb]').forEach(function(b){b.onclick=function(){b.disabled=true;b.textContent='Salvando…';api({a:'liberar',s:pw(),au:b.dataset.lb,v:b.dataset.v},function(r){if(r&&r.ok){D.lib=r.lib;desenha()}else{b.textContent='Erro: '+(r&&r.erro);}},function(){b.textContent='Sem conexão'})}});document.querySelectorAll('th[data-s]').forEach(function(t){t.onclick=function(){var k=+t.dataset.s;sortD=sortK===k?-sortD:1;sortK=k;desenha()}});$('up').textContent='atualizado '+new Date().toLocaleTimeString('pt-BR')}
$('csv').onclick=function(){if(!D)return;var c=['Nome;Turma;Dupla;Aula 1;Aula 2;Aula 3;Aula 4;Aula 5;Nota;Trocas de tela;Travas;Parado (min)'].concat(D.resumo.map(function(r){return r.slice(0,12).map(function(x){return '"'+String(x).replace(/"/g,'""').replace('.',',')+'"'}).join(';')}));var b=new Blob(['﻿'+c.join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='trilha-2ano-notas.csv';a.click()};
if(pw()){$('pw').value=pw();entrar()}
</script></body></html>
