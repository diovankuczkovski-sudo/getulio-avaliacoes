<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trilha: O Caso da Feira</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--papel:#FDFDFA;--verm:#D9381E;--azul:#1C5FD4;--verde:#2F9E44;--marca:#FFD43B;--tinta:#2A2B33;--graf:#5B5E6B;--irreg:255px 14px 225px 14px/14px 225px 14px 255px}
*{box-sizing:border-box}
body{margin:0;font-family:'Patrick Hand',system-ui,sans-serif;font-size:19px;color:var(--tinta);background:var(--papel);background-image:linear-gradient(transparent 31px,#cfe0f3 32px);background-size:100% 32px;line-height:32px}
body:before{content:"";position:fixed;left:34px;top:0;bottom:0;width:2px;background:#f0a3a3;z-index:0}
#app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:14px 14px 80px 52px}
h1,h2,h3{font-family:Caveat,cursive;line-height:1.05;margin:6px 0}
h1{font-size:44px;color:var(--verm)}h2{font-size:34px;color:var(--azul)}h3{font-size:26px}
b,.mk{background:linear-gradient(transparent 55%,var(--marca) 55%);font-weight:normal}
.card{background:#fff;border:2.5px solid var(--tinta);border-radius:var(--irreg);padding:10px 16px;margin:12px 0;line-height:28px;box-shadow:3px 4px 0 rgba(0,0,0,.12)}
.card.ok{border-color:var(--verde)}.card.no{border-color:var(--verm)}.card.pista{background:#fffbe0}
button,.btn{font-family:inherit;font-size:20px;background:var(--azul);color:#fff;border:2.5px solid var(--tinta);border-radius:var(--irreg);padding:8px 18px;cursor:pointer;min-height:46px;margin:6px 6px 6px 0}
button.sec{background:#fff;color:var(--tinta)}button.verm{background:var(--verm)}button:disabled{opacity:.5;cursor:not-allowed}
input[type=text],select{font-family:inherit;font-size:20px;padding:8px 12px;border:2.5px solid var(--tinta);border-radius:12px;width:100%;max-width:420px;min-height:46px;background:#fff}
label{display:block;margin-top:8px}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--tinta);margin:8px 0;line-height:26px}
.opt.sel{background:#dbe8ff;border-color:var(--azul)}.opt.certa{background:#d8f5de;border-color:var(--verde)}.opt.errada{background:#ffe0dc;border-color:var(--verm)}
.small{font-size:16px;color:var(--graf);line-height:22px}
.graf{width:100%;max-width:440px;background:#fff;border:2px solid #cdd;border-radius:10px;margin:6px 0}
table.tab{border-collapse:collapse;margin:8px 0;font-size:17px;line-height:24px}table.tab th,table.tab td{border:2px solid var(--tinta);padding:3px 10px;text-align:center}table.tab th{background:#fff3bf}
details{margin:8px 0}summary{cursor:pointer;color:var(--azul);font-family:Caveat;font-size:26px;line-height:30px}
.bar{height:14px;background:#e4e8ee;border:2px solid var(--tinta);border-radius:10px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--verde)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tag{display:inline-block;padding:0 10px;border:2px solid var(--tinta);border-radius:20px;font-size:15px;line-height:24px;background:#fff}
.cod{font-family:Caveat;font-size:62px;letter-spacing:8px;color:var(--verm);text-align:center;line-height:70px}
.ov{position:fixed;inset:0;background:rgba(20,20,30,.93);z-index:99;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.ov .box{background:var(--papel);max-width:560px;width:100%;border:4px solid var(--verm);border-radius:var(--irreg);padding:16px 20px;text-align:center}
.ov img{width:150px;height:150px;border-radius:50%;border:3px solid var(--tinta)}
.noselect{-webkit-user-select:none;user-select:none}
@media(max-width:560px){body{font-size:17px}#app{padding-left:44px}h1{font-size:36px}}
@media print{body{background:#fff}body:before{display:none}}
</style></head><body>

  if(q.t==='mc'){pick=sel;ok=sel===q.ci}else{var v=parseFloat($('num').value.trim().replace(/\s/g,'').replace(',','.').replace('−','-'));if(isNaN(v)){$('cd').textContent='Digite só o número (use vírgula para decimais).';return}pick=v;ok=Math.abs(v-q.a)<=q.tol}
  ans=1;clearInterval(iv);var el=(Date.now()-A.u)/1000,fast=el<mt+3;A.tq[A.i]=Math.round(el);A.r[A.i]=ok?1:0;A.p[A.i]=pick;
  if(ok){A.cw=0;A.cf=0}else{A.cw++;if(fast)A.cf++}if(fast)A.rp++;
  if(q.t==='mc')document.querySelectorAll('.opt').forEach(function(b,k){b.disabled=true;if(k===q.ci)b.classList.add('certa');else if(k===sel)b.classList.add('errada')});else $('num').disabled=true;
  $('rsp').style.display='none';$('cd').textContent='';
  $('fb').innerHTML='<div class="card '+(ok?'ok':'no')+'"><b>'+(ok?'✅ Correto!':'❌ Não foi dessa vez.')+'</b><br>'+q.sol+(q.t==='num'&&!ok?'<br><span class="small">Resposta certa: '+fmt(q.a,3)+(q.un?' '+q.un:'')+'</span>':'')+'</div><button id="px">'+(A.i+1>=N?'Finalizar a aula':'Próxima questão')+'</button>';
  A.i++;save();var gatilho=A.cw>=3?'3 erros seguidos':A.cf>=2?'erros no tempo mínimo':'';
  $('px').onclick=function(){if(gatilho){A.cw=0;A.cf=0;A.lk++;var sg=Math.min(15*A.lk,60);A.lockUntil=Date.now()+sg*1000;A.lockMotivo=gatilho;A.lockQ=q.b;save();evento('trava_antichute',gatilho+' · '+sg+'s',n);trava(n,false)}else questao(n)}}}
function trava(n,rec){var L=LESSONS[n-1],A=st(n),sg=Math.ceil((A.lockUntil-Date.now())/1000),tot=Math.min(15*A.lk,60);if(sg<=0){A.lockUntil=0;save();return questao(n)}
 var blk=L.blocos[A.lockQ!=null?A.lockQ:0];
 $('ov').innerHTML='<div class="ov" role="alertdialog"><div class="box"><img src="'+IMG.pare+'" alt=""><h2 style="color:var(--verm)">Pare de chutar e vai estudar!</h2><p>Esta é a sua <b>'+A.lk+'ª parada</b>: desta vez são <b>'+tot+' segundos</b>. Releia a explicação abaixo antes de continuar.</p><div class="card" style="text-align:left;max-height:34vh;overflow:auto"><b>'+blk.t+'</b>'+blocoHTML(blk)+'</div><button id="vt" disabled>Leia com calma… '+sg+'s</button></div></div>';
 clearInterval(G.lockT);G.lockT=setInterval(function(){var r=Math.ceil((A.lockUntil-Date.now())/1000),b=$('vt');if(!b){clearInterval(G.lockT);return}if(r>0)b.textContent='Leia com calma… '+r+'s';else{clearInterval(G.lockT);b.disabled=false;b.textContent='Já estudei. Continuar';b.onclick=function(){A.lockUntil=0;save();$('ov').innerHTML='';questao(n)}}},500)}


/* ---------- gabarito da aula desplugada ---------- */
function gabarito(n){var L=LESSONS[n-1],A=st(n),N=L.g.length,MIN=N*45,qs=[];for(var i=0;i<N;i++)qs.push(getQ(n,i));
 var h='<button class="sec" id="vm">← mural</button><h1>Gabarito · Aula '+n+' · versão '+esc(A.ver)+'</h1><div class="card">Dupla: <b>'+esc(S.nome)+'</b> + <b>'+esc(S.par)+'</b>. Resolvam na folha e digitem aqui <b>só as respostas finais</b>. Use vírgula para decimais. Cada questão tem uma única conferência: o botão de enviar libera depois do tempo mínimo e com todas as respostas preenchidas.<br><span class="tag" id="rel">⏱ 0:00</span></div>';
 qs.forEach(function(q,i){h+='<div class="card"><b>Questão '+(i+1)+'</b>'+(q.t==='num'&&q.un?' <span class="small">('+esc(q.un)+')</span>':'')+'<div>'+(q.t==='mc'?q.o.map(function(o,k){return '<button class="opt" data-q="'+i+'" data-k="'+k+'" style="display:inline-block;width:auto;min-width:56px">'+'ABCD'[k]+'</button>'}).join(' ')+'<span class="small"> (a letra da alternativa na folha)</span>':'<input type="text" inputmode="decimal" data-q="'+i+'" autocomplete="off" placeholder="resposta" style="max-width:220px">')+'</div></div>'});
 h+='<div class="row"><button id="env" disabled>Enviar gabarito</button><span class="small" id="cd"></span></div>';
 show(h);$('vm').onclick=menu;
 qs.forEach(function(q,i){var v=A.p[i];if(v==null)return;if(q.t==='mc'){var b=document.querySelector('.opt[data-q="'+i+'"][data-k="'+v+'"]');if(b)b.classList.add('sel')}else{var f=document.querySelector('input[data-q="'+i+'"]');if(f)f.value=String(v).replace('.',',')}});
 document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var i=+b.dataset.q;document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');A.p[i]=+b.dataset.k;save();upd()}});
 document.querySelectorAll('input[data-q]').forEach(function(f){f.oninput=function(){var v=parseFloat(f.value.trim().replace(/\s/g,'').replace(',','.').replace('−','-'));A.p[+f.dataset.q]=f.value.trim()===''||isNaN(v)?null:v;save();upd()}});
 function completo(){for(var i=0;i<N;i++)if(A.p[i]==null)return false;return true}
 function upd(){if(!$('rel'))return;var el=(Date.now()-A.ini)/1000,rest=Math.ceil(MIN-el);$('rel').textContent='⏱ '+Math.floor(el/60)+':'+('0'+Math.floor(el%60)).slice(-2);$('env').disabled=!(rest<=0&&completo());$('cd').textContent=rest>0?'O envio libera em '+Math.floor(rest/60)+' min '+(rest%60)+' s (tempo mínimo da aula).':(completo()?'':'Preencha todas as respostas.')}
 var iv=setInterval(function(){if(!$('rel')){clearInterval(iv);return}upd()},1000);upd();
 $('env').onclick=function(){clearInterval(iv);for(var i=0;i<N;i++){var q=qs[i],v=A.p[i];A.r[i]=q.t==='mc'?(v===q.ci?1:0):(Math.abs(v-q.a)<=q.tol?1:0)}A.i=N;A.tq=[];save();finalizar(n)}}
function revisao(n){var L=LESSONS[n-1],A=st(n),h='<div class="card"><b>Conferência das respostas</b>';for(var i=0;i<L.g.length;i++){var q=getQ(n,i),ok=A.r[i];h+='<p style="margin:6px 0"><b>'+(i+1)+'.</b> '+(ok?'✅':'❌')+' '+q.sol+(q.t==='num'&&!ok?' <span class="small">(resposta certa: '+fmt(q.a,3)+')</span>':'')+'</p>'}return h+'</div>'}

/* ---------- fim da aula ---------- */
function finalizar(n){var L=LESSONS[n-1],A=st(n),N=L.g.length,bits='';for(var i=0;i<N;i++)bits+=A.r[i]?'1':'0';A.fim=1;A.bits=bits;save();G.guard=0;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){};enviar(n)}
function enviar(n){var L=LESSONS[n-1],A=st(n);
 show('<h2>Enviando sua aula…</h2><p class="small">Não feche esta página.</p>');
 api({a:'aula',n:S.nome,t:S.turma,au:n,r:A.bits,ta:A.ta,tp:A.tp,tr:A.tr,lk:A.lk,cod:L.tipo==='desplug'?S.cod:''},function(r){
  if(r&&r.ok){A.env={pontos:r.pontos,acertos:r.acertos,total:r.total,dup:!!r.dup,par:r.parceiro||''};save();evento('fim_aula','ta='+A.ta+'s;tp='+A.tp+'s;fora='+A.tf+'s;trocas='+A.tr+';travas='+A.lk+';ritmo='+A.rp+';tq='+A.tq.join('/'),n);resultado(n)}
  else show('<div class="card no"><b>Não foi possível registrar.</b> '+esc((r&&r.erro)||'')+'</div><button id="rt">Tentar de novo</button>'),$('rt').onclick=function(){enviar(n)}},
  function(){show('<div class="card no"><b>Sem conexão com o servidor.</b> Suas respostas estão salvas neste aparelho. Conecte-se e tente de novo.</div><button id="rt">Tentar de novo</button>');$('rt').onclick=function(){enviar(n)}})}
function resultado(n){var L=LESSONS[n-1],A=st(n),e=A.env,tot=0;for(var k in S.au)if(S.au[k].env)tot+=S.au[k].env.pontos;
 var h='<h1>Aula '+n+' concluída</h1><div class="card ok"><h3>'+e.acertos+' de '+e.total+' acertos · <span class="mk">'+fmt(e.pontos)+' de 2,0 pontos</span></h3>'+(e.dup?'<p class="small">Esta aula já tinha sido registrada (por você ou pela sua dupla).</p>':'')+(e.par?'<p class="small">A nota também foi lançada para <b>'+esc(e.par)+'</b>.</p>':'')+'</div><div class="card pista"><img src="'+(n===5?IMG.veredito:IMG.pista)+'" alt="" style="float:right;width:110px;margin:0 0 6px 10px;border-radius:12px">'+L.pista+'</div><div class="card">Nota acumulada: <b>'+fmt(tot)+' / 10</b></div>'+(L.tipo==='desplug'&&A.r.length?revisao(n):'')+'<button id="vm">Voltar ao mural</button>';
 show(h);$('vm').onclick=menu}

/* ---------- vigilância: troca de tela, tempo ativo e parado ---------- */
function bloqueio(motivo){if(!G.guard||S.au[G.guard]&&S.au[G.guard].fim)return;var L=LESSONS[G.guard-1];if(L.tipo!=='plug')return;if(G.away)return;G.away=Date.now();var A=st(G.guard);A.tr++;save();evento('troca_tela',motivo+' · troca nº '+A.tr,G.guard);
 var espera=Math.min(5*A.tr,30);$('ov').innerHTML='<div class="ov"><div class="box"><h2 style="color:var(--verm)">Você saiu da tela da prova</h2><p>Motivo: '+motivo+'. <b>O professor foi avisado</b> (troca nº '+A.tr+').</p><button id="vb" disabled>Aguarde '+espera+'s</button></div></div>';
 var t0=Date.now(),iv=setInterval(function(){var r=Math.ceil(espera-(Date.now()-t0)/1000),b=$('vb');if(!b){clearInterval(iv);return}if(r>0)b.textContent='Aguarde '+r+'s';else{clearInterval(iv);b.disabled=false;b.textContent='Voltar à prova';b.onclick=function(){A.tf+=Math.round((Date.now()-G.away)/1000);G.away=0;G.last=Date.now();$('ov').innerHTML='';tela(1);save();if(A.lockUntil>Date.now())trava(G.guard,true)}}},400)}
document.addEventListener('visibilitychange',function(){if(document.hidden)bloqueio('troca de aba ou janela')});
window.addEventListener('blur',function(){setTimeout(function(){if(G.guard&&!document.hasFocus())bloqueio('a janela perdeu o foco')},250)});
document.addEventListener('fullscreenchange',function(){if(G.guard&&!document.fullscreenElement){var L=LESSONS[G.guard-1];if(L.tipo==='plug')bloqueio('saída da tela cheia')}});
['copy','cut','paste','contextmenu'].forEach(function(ev){document.addEventListener(ev,function(e){if(G.guard&&LESSONS[G.guard-1].tipo==='plug'&&!(e.target&&e.target.tagName==='INPUT')){e.preventDefault()}})});
['pointerdown','keydown','scroll','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){G.last=Date.now()},true)});
var mm=0;document.addEventListener('mousemove',function(){var t=Date.now();if(t-mm>1500){mm=t;G.last=t}});
setInterval(function(){if(!G.guard)return;var n=G.guard,A=st(n);if(A.fim||A.env||G.away)return;var L=LESSONS[n-1],lim=L.tipo==='plug'?30:180,idle=(Date.now()-G.last)/1000;
 if(G.away||document.hidden)return;if(idle>lim){A.tp++;if(A.tp%60===0&&L.tipo==='plug')evento('tempo_parado',Math.round(idle)+'s sem interação',n)}else A.ta++;if(++G.tickN%5===0)save()},1000);
window.addEventListener('beforeunload',function(){save()});

if(!S.nome)telaInicio();else menu();
</script></body></html>
